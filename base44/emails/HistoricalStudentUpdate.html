<mjml>
  <mj-head>
    <mj-title>Your Blockward verification update</mj-title>
    <mj-preview>There is an update on your past achievement verification</mj-preview>
    <mj-attributes>
      <mj-all font-family="Inter, Helvetica, Arial, sans-serif" />
      <mj-section background-color="#f8fafc" padding="0 36px" />
      <mj-text color="#000000" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#2270ec" border-radius="0px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f8fafc">
    <mj-section background-color="#2270ec" padding="20px 36px">
      <mj-column>
        <mj-image src="https://media.base44.com/images/public/6936b840baa53bb465f68d09/d0902e28f_logo.png" alt="Blockward" align="left" width="120px" />
      </mj-column>
    </mj-section>
    <mj-section padding="36px 36px 8px">
      <mj-column>
        <mj-text font-size="24px" font-weight="700" color="#000000" line-height="1.25">{{headline}}</mj-text>
        <mj-text color="#000000">{{message}}</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="16px 36px 12px">
      <mj-column>
        <mj-button href="{{cta_url}}">{{cta_label}}</mj-button>
      </mj-column>
    </mj-section>
    <mj-section padding="8px 36px 24px">
      <mj-column>
        <mj-text color="#6b7280" font-size="12px">Request {{request_ref}}. An achievement is never marked Blockward Verified until the authorised verifier confirms it and the credential is issued.</mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
